name: paper-check

on:
  workflow_dispatch:
    inputs:
      paper_repository:
        description: Private paper repository to check
        required: true
        default: czfdth/rag-attack-defense
      paper_ref:
        description: Paper branch, tag, or commit
        required: true
        default: master
      profile:
        description: Readiness profile
        required: true
        default: standard
        type: choice
        options:
          - minimal
          - standard
          - high-assurance

permissions:
  contents: read

jobs:
  paper-check:
    name: deterministic paper checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private paper
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.paper_repository }}
          ref: ${{ inputs.paper_ref }}
          path: _paper
          token: ${{ secrets.PAPER_REPOSITORY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tool dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Validate paper checkout
        shell: pwsh
        run: |
          $paper = "_paper"
          if (-not (Test-Path -LiteralPath $paper -PathType Container)) {
            throw "paper_root does not exist in this checkout: $paper"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $paper "ccfa.yaml") -PathType Leaf)) {
            throw "paper_root lacks ccfa.yaml: $paper"
          }

      - name: Readiness report
        shell: pwsh
        run: |
          $env:PYTHONPATH = "tools"
          python -m ccfa.readiness `
            --paper-root "_paper" `
            --profile "${{ inputs.profile }}" `
            --out reviews/readiness.md

      - name: Core deterministic gates
        shell: pwsh
        run: |
          $env:PYTHONPATH = "tools"
          python -m ccfa.validate "_paper/ccfa.yaml"
          python -m ccfa.citation_guard --paper-root "_paper"
          python -m ccfa.trace_claims --paper-root "_paper"
          python -m ccfa.novelty --paper-root "_paper"
          python -m ccfa.stats_plan --paper-root "_paper"
          python -m ccfa.governance --paper-root "_paper"
          python -m ccfa.repro_env --paper-root "_paper"
          python -m ccfa.latex_check `
            --manuscript "_paper/manuscript" `
            --bib "_paper/manuscript/references.bib"
          python -m ccfa.final_check `
            --manuscript "_paper/manuscript" `
            --pdf "_paper/submission/final.pdf"
          python -m ccfa.argument_audit --paper-root "_paper"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: _paper/reviews/readiness.md
          if-no-files-found: ignore
