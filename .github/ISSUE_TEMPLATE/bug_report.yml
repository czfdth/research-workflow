name: Bug report
description: A gate, tool or test does the wrong thing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A reproducible input is worth more than a description. If a gate gave a
        wrong answer, please include the exact command, the paths involved, and
        the output you got versus the output you expected.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The exact command and its output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: And, if a gate is involved, what the pass/fail verdict should have been and why.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether you used a PowerShell wrapper or `scripts/ccfa`.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of the environment check
      description: "`sh scripts/ccfa doctor` (or `scripts/doctor.ps1`) — please paste the summary line."
      render: shell
    validations:
      required: false
